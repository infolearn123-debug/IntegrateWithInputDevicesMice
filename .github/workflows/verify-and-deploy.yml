name: Verify and Deploy

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Basic import checks
        run: |
          python - <<'PY'
          import importlib
          for m in ('gradio','numpy','scipy','matplotlib'):
              importlib.import_module(m)
          print('imports ok')
          PY
      - name: Byte-compile Python files
        run: python -m py_compile app.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ secrets.HF_TOKEN != '' && secrets.HF_USERNAME != '' && secrets.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -e
          git init
          git remote add hf "https://$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/IntegrateWithInputDevicesMice" || true
          git add -A
          git commit -m "Deploy from GitHub Actions: $GITHUB_SHA" || true
          git push --force hf HEAD:main
